; PlatformIO project configuration — Edge Anomaly Stream Filter
; Build:   pio run -e esp32dev
; Upload:  pio run -e esp32dev -t upload
; Monitor: pio device monitor -b 115200
; Wokwi:   build, then "Wokwi: Start Simulator" in VS Code (uses wokwi.toml + diagram.json)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Only the firmware is compiled; src/analytical_tools/ holds the Python tools.
build_src_filter = +<edge_node/>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
